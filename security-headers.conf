# Cabeceras de seguridad de la landing. Se incluye desde cada `location` de nginx.conf.template: en nginx, un
# `location` que define su propio add_header descarta los del nivel `server`, así que no basta con ponerlas una vez.
#
# CSP: scripts solo propios (Vite genera un módulo, sin scripts en línea); estilos propios + en línea (React usa
# style="...") + Google Fonts; llamadas fetch al API (VITE_API_URL, un https distinto según el entorno).
# Google Identity Services (botón «Continuar con Google» de /entrar): script, estilos y marco del botón en
# accounts.google.com (connect-src ya admite https:).
# Cloudflare inyecta su script de analítica (Web Analytics) al pasar por su proxy: static.cloudflareinsights.com.
# Si algún día la landing incrusta el juego en un iframe, hay que añadir `frame-src` con su dirección.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
